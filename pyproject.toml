[project]
name = "planedesign"
version = "0.1.0"
description = "Sub-250 g ESP32-S3 RC plane: aero design, mass/CG budget, and rib export"
requires-python = ">=3.10"
dependencies = [
    "aerosandbox>=4.2",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
cad = ["cadquery>=2.4"]   # for the rib generator (next step)

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning"]
